{% extends "base.html" %}

{% block content %}

<div class="row">
    {% include "dashboards/sidebar.html" %}
     <div class="col-md-9">
        <h3>All Categories</h3>
        <a href="{% url "add_category" %}" class="btn btn-dark text-light float-right mb-3">Add Category</a>
        <table class="table table-hover">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Category Name</th>
                <th scope="col">Created At</th>
                <th scope="col">Updated At</th>
              </tr>
            </thead>
            <tbody>
                {% for cat in categories %}
              <tr>
                <th scope="row">{{forloop.counter}}</th>
                <td>{{cat}}</td>
                <td>{{cat.created_at}}</td>
                <td>{{cat.updated_at}}</td>
                <td><a href=""><i class="fa fa-pencil-square-o text-success" aria-hidden="true"></i></a></td>
                <td><a href=""><i class="fa fa-trash-o text-danger" aria-hidden="true"></i></a></td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
     </div>
 </div>

{% endblock  %}
