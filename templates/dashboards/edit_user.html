{% extends "base.html" %}

{% block content %}
{% load crispy_forms_tags %}
<div class="row">
    {% include "dashboards/sidebar.html" %}
    {% if perms.auth.add_user %}
     <div class="col-md-9">
        <h3>Edit User</h3>
        <form action="{% url "edit_user" user.id %}" method="POST">
            {% csrf_token %}
            {{form | crispy}}
            <button type="submit" class="btn btn-warning">Submit</button>
        </form> 
     </div>
     {% else %}
     <p>You don't have permission for this page</p>
     {% endif %}
 </div>

{% endblock content %}
